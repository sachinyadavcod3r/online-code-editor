<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeEditor IDE</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="codemirror-5.65.19/lib/codemirror.css" />
  <link rel="stylesheet" href="codemirror-5.65.19/theme/dracula.css" />
  <link rel="stylesheet" href="codemirror-5.65.19/theme/eclipse.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <!-- Workspace -->
  <div class="workspace">
    <div class="editor-pane">
      <textarea id="editor"></textarea>
    </div>

    <div id="ioPane" class="io-pane bg-light">
      <div class="p-3">
        <h6>Input</h6>
        <textarea id="input" class="form-control mb-3" rows="6"></textarea>
        <h6>Output</h6>
        <textarea id="output" class="form-control" rows="10" readonly></textarea>
      </div>
    </div>
  </div>

  <script src="codemirror-5.65.19/lib/codemirror.js"></script>
  <script src="codemirror-5.65.19/mode/clike/clike.js"></script>
  <script src="codemirror-5.65.19/mode/python/python.js"></script>
  <script src="codemirror-5.65.19/addon/edit/closebrackets.js"></script>

  <script src="/js/editor.js"></script>
  <script src="/js/layout.js"></script>
  
</body>
</html>
