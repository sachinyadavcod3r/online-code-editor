<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CodeEditor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
  <div class="d-flex" id="dashboard">
    <!-- Sidebar -->
    <div class="bg-dark text-white p-3 vh-100" id="sidebar">
      <!-- <h4 class="mb-4">💻 CodeEditor</h4> -->
      <p id="welcomeUser" class="fw-bold text-warning mb-4">Welcome!</p>
    </div>

    <!-- Main Content -->
    <div class="p-4 w-100">
      <h2>Welcome back, <span id="username"></span> 👋</h2>
      <p class="text-muted">Here’s your dashboard.</p>

      <div class="card mt-4 p-3">
        <h5>Your quick actions</h5>
        <ul>
          <li>⚡ Open the <a href="/">Code Editor</a> to continue coding.</li>
          <li>💾 View your saved codes under “Your Programs”.</li>
          <li>🌗 Change theme in the editor anytime.</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="/js/profile.js"></script>
  <script src="/js/layout.js"></script>

</body>
</html>
