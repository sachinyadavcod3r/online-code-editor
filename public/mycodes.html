<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Projects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h2 class="mb-4">My Projects</h2>

    <div id="projectList" class="list-group"></div>
  </div>

  <script>
  async function loadProjects() {
    const res = await fetch("/api/code/mycodes", { credentials: "include" });

    if (res.status === 401) {
      location.href = "/login";
      return;
    }

    const codes = await res.json();
    const list = document.getElementById("projectList");

    list.innerHTML = "";

    codes.forEach(p => {
      const item = document.createElement("div");
      item.className = "list-group-item d-flex justify-content-between align-items-center";

      item.innerHTML = `
        <div>
          <strong>${p.filename}</strong>
        </div>

        <div class="d-flex gap-2">

          <button class="btn btn-sm btn-primary openBtn">Open</button>

          <button class="btn btn-sm btn-warning renameBtn">Rename ✏️</button>

          <button class="btn btn-sm btn-danger deleteBtn">Delete 🗑️</button>
        </div>
      `;

      // OPEN FILE
      item.querySelector(".openBtn").addEventListener("click", () => {
        window.location.href = "/?open=" + p._id;
      });

      // DELETE FILE
      item.querySelector(".deleteBtn").addEventListener("click", async () => {
        if (!confirm("Are you sure you want to delete this project?")) return;

        await fetch("/api/code/delete/" + p._id, {
          method: "DELETE",
          credentials: "include"
        });

        loadProjects(); // Refresh list
      });

      // RENAME FILE
      item.querySelector(".renameBtn").addEventListener("click", async () => {
        let newName = prompt("Enter new project name (without extension):");

        if (!newName || newName.trim() === "") {
          alert("Name cannot be empty!");
          return;
        }

        newName = newName.trim();

        await fetch("/api/code/rename/" + p._id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ newName })
        });

        loadProjects(); // Refresh list
      });

      list.appendChild(item);
    });
  }

  loadProjects();
</script>

</body>
</html>
